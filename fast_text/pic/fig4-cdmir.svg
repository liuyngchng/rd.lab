<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 720" width="560" height="720">
  <defs>
    <marker orient="auto" overflow="visible" markerUnits="strokeWidth" id="Arrow" viewBox="-1 -4 10 8" markerWidth="10" markerHeight="8" color="black"><g><path d="M 8 0 L 0 -3 L 0 3 Z" fill="currentColor" stroke="currentColor" stroke-width="1"/></g></marker>
    <marker orient="auto" overflow="visible" markerUnits="strokeWidth" id="ArrowGreen" viewBox="-1 -4 10 8" markerWidth="10" markerHeight="8" color="#22c55e"><g><path d="M 8 0 L 0 -3 L 0 3 Z" fill="currentColor" stroke="currentColor" stroke-width="1"/></g></marker>
    <marker orient="auto" overflow="visible" markerUnits="strokeWidth" id="ArrowRed" viewBox="-1 -4 10 8" markerWidth="10" markerHeight="8" color="#ef4444"><g><path d="M 8 0 L 0 -3 L 0 3 Z" fill="currentColor" stroke="currentColor" stroke-width="1"/></g></marker>
  </defs>
  <g stroke="none" stroke-opacity="1" stroke-dasharray="none" fill="none" fill-opacity="1">
    <g>
      <!-- Input: 意图向量R -->
      <ellipse cx="260" cy="18" rx="70" ry="16" stroke="#667eea" stroke-width="2" fill="#667eea"/>
      <text x="260" y="23" fill="white" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">C³-Classifier 输出 R</text>

      <line x1="260" y1="34" x2="260" y2="58" marker-end="url(#Arrow)" stroke="black" stroke-width="1.5"/>

      <!-- Rule 1: Emergency Preemption -->
      <rect x="60" y="60" width="400" height="62" stroke="#ef4444" stroke-width="2" rx="6" fill="#fef2f2"/>
      <text x="260" y="80" fill="#991b1b" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Rule 1: 紧急安全抢占（Emergency Safety Preemption）</text>
      <text x="260" y="97" fill="#991b1b" font-family="sans-serif" font-size="10" text-anchor="middle">∃ emergency ∈ R → primary = emergency，无条件抢占</text>
      <text x="260" y="113" fill="#991b1b" font-family="sans-serif" font-size="10" text-anchor="middle">跳过 Rule 2–4，直入应急调度流程</text>

      <!-- Yes branch from Rule 1 -->
      <line x1="460" y1="91" x2="496" y2="91" marker-end="url(#ArrowRed)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="480" y="84" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">Yes</text>
      <rect x="472" y="74" width="48" height="34" stroke="none" fill="none"/>
      <!-- Emergency box on the right -->
      <rect x="460" y="32" width="58" height="22" stroke="#ef4444" stroke-width="1" rx="4" fill="#fee2e2"/>
      <text x="489" y="47" fill="#991b1b" font-family="sans-serif" font-size="9" text-anchor="middle">应急调度</text>

      <!-- No branch from Rule 1 -->
      <line x1="260" y1="122" x2="260" y2="146" marker-end="url(#Arrow)" stroke="black" stroke-width="1.5"/>
      <text x="268" y="138" fill="#333" font-family="sans-serif" font-size="9">No</text>

      <!-- Rule 2: Ambiguity Detection -->
      <rect x="60" y="148" width="400" height="78" stroke="#f97316" stroke-width="2" rx="6" fill="#fff7ed"/>
      <text x="260" y="168" fill="#92400e" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Rule 2: 歧义检测与反问（Ambiguity Detection）</text>
      <text x="260" y="184" fill="#92400e" font-family="sans-serif" font-size="10" text-anchor="middle">|R| ≥ 2 ∧ c₁ − c₂ &lt; δamb(0.20) ∧ ¬(s₁ = s₂ = keyword)</text>
      <text x="260" y="200" fill="#92400e" font-family="sans-serif" font-size="10" text-anchor="middle">满足全部三条件时 → 生成 Markdown 选项反问用户</text>
      <text x="260" y="216" fill="#92400e" font-family="sans-serif" font-size="10" text-anchor="middle">注：双 keyword 多意图（gap=0）豁免反问，走 Rule 3+4 并行处理</text>

      <!-- Yes branch from Rule 2 -->
      <line x1="460" y1="187" x2="496" y2="187" marker-end="url(#ArrowRed)" stroke="#ef4444" stroke-width="1.5"/>
      <text x="480" y="180" fill="#ef4444" font-family="sans-serif" font-size="9" text-anchor="middle">Yes</text>
      <rect x="485" y="130" width="55" height="22" stroke="#ef4444" stroke-width="1" rx="4" fill="#fee2e2"/>
      <text x="512" y="145" fill="#991b1b" font-family="sans-serif" font-size="9" text-anchor="middle" transform="rotate(0,512,145)">反问，结束</text>

      <!-- No branch from Rule 2 -->
      <line x1="260" y1="226" x2="260" y2="250" marker-end="url(#Arrow)" stroke="black" stroke-width="1.5"/>
      <text x="268" y="242" fill="#333" font-family="sans-serif" font-size="9">No</text>

      <!-- Rule 3: Normal Routing -->
      <rect x="60" y="252" width="400" height="62" stroke="#22c55e" stroke-width="2" rx="6" fill="#f0fdf4"/>
      <text x="260" y="272" fill="#166534" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Rule 3: 置信度门控正常路由（Confidence-Gated Routing）</text>
      <text x="260" y="289" fill="#166534" font-family="sans-serif" font-size="10" text-anchor="middle">primary = R[0]，按 primary.i 路由至对应 Agent 分支</text>
      <text x="260" y="305" fill="#166534" font-family="sans-serif" font-size="10" text-anchor="middle">若 primary.s = fallback → Agent System Prompt 追加低置信度软化提示</text>

      <line x1="260" y1="314" x2="260" y2="338" marker-end="url(#Arrow)" stroke="black" stroke-width="1.5"/>

      <!-- Route to branch agents -->
      <rect x="60" y="340" width="400" height="28" stroke="#eab308" stroke-width="1.5" rx="4" fill="#fef9c3"/>
      <text x="260" y="358" fill="#78350f" font-family="sans-serif" font-size="11" text-anchor="middle">按意图路由至对应 Agent（检索KB+LLM流式回答）</text>

      <line x1="260" y1="368" x2="260" y2="392" marker-end="url(#Arrow)" stroke="black" stroke-width="1.5"/>

      <!-- Rule 4: Secondary Intent -->
      <rect x="60" y="394" width="400" height="78" stroke="#3b82f6" stroke-width="2" rx="6" fill="#eff6ff"/>
      <text x="260" y="414" fill="#1e40af" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Rule 4: 置信度门控次意图并行处理</text>
      <text x="260" y="431" fill="#1e40af" font-family="sans-serif" font-size="10" text-anchor="middle">primary ≠ emergency ∧ ∃ k>0: iₖ ≠ primary.i ∧ cₖ ≥ θsec(0.40)</text>
      <text x="260" y="447" fill="#1e40af" font-family="sans-serif" font-size="10" text-anchor="middle">KB型次意图（billing/repair/faq）→ 独立第二轮检索+LLM流式回答</text>
      <text x="260" y="463" fill="#1e40af" font-family="sans-serif" font-size="10" text-anchor="middle">非KB型次意图（business/emergency）→ 仅追加一句引导性追问文本</text>

      <!-- Yes branch from Rule 4 -->
      <line x1="460" y1="433" x2="496" y2="433" marker-end="url(#ArrowGreen)" stroke="#22c55e" stroke-width="1.5"/>
      <text x="480" y="426" fill="#22c55e" font-family="sans-serif" font-size="9" text-anchor="middle">Yes</text>
      <rect x="478" y="376" width="55" height="22" stroke="#22c55e" stroke-width="1" rx="4" fill="#dcfce7"/>
      <text x="505" y="391" fill="#166534" font-family="sans-serif" font-size="9" text-anchor="middle">并行处理</text>

      <!-- No branch from Rule 4 -->
      <line x1="260" y1="472" x2="260" y2="498" marker-end="url(#Arrow)" stroke="black" stroke-width="1.5"/>
      <text x="268" y="490" fill="#333" font-family="sans-serif" font-size="9">No / 完成</text>

      <!-- Done -->
      <ellipse cx="260" cy="514" rx="56" ry="16" stroke="#667eea" stroke-width="2" fill="#667eea"/>
      <text x="260" y="519" fill="white" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">SSE流式输出</text>

      <!-- Summary box at bottom -->
      <rect x="30" y="550" width="500" height="66" stroke="#8b5cf6" stroke-width="1.5" rx="8" fill="#ede9fe"/>
      <text x="260" y="568" fill="#4c1d95" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">CDMIR 设计哲学</text>
      <text x="260" y="585" fill="#4c1d95" font-family="sans-serif" font-size="10" text-anchor="middle">安全优先（Rule 1）→ 自信处理（Rule 3）→ 犹豫澄清（Rule 2）→ 多意并行（Rule 4）</text>
      <text x="260" y="603" fill="#4c1d95" font-family="sans-serif" font-size="10" text-anchor="middle">置信度信号 = 从分类层"内部闸门"升级为路由层"全局决策依据"</text>
    </g>
  </g>
</svg>
