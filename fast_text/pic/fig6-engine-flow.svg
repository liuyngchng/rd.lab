<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 560" width="360" height="560">
  <defs>
    <marker orient="auto" overflow="visible" markerUnits="strokeWidth" id="Arr4" viewBox="-1 -4 10 8" markerWidth="10" markerHeight="8" color="black"><g><path d="M 8 0 L 0 -3 L 0 3 Z" fill="currentColor" stroke="currentColor" stroke-width="1"/></g></marker>
  </defs>
  <g stroke="none" stroke-opacity="1" stroke-dasharray="none" fill="none" fill-opacity="1">
    <g>
      <ellipse cx="180" cy="15" rx="55" ry="14" stroke="#667eea" stroke-width="2" fill="#667eea"/>
      <text x="180" y="19" fill="white" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">开始执行工作流</text>

      <line x1="180" y1="29" x2="180" y2="52" marker-end="url(#Arr4)" stroke="black" stroke-width="1.5"/>

      <rect x="65" y="54" width="230" height="36" stroke="black" stroke-width="1" rx="6" fill="#f5f5f5"/>
      <text x="180" y="68" fill="#333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">1. 加载工作流 &amp; 节点排序</text>
      <text x="180" y="82" fill="#666" font-family="sans-serif" font-size="9" text-anchor="middle">从DB读取WorkflowDef &amp; 按OrderIndex排序</text>

      <line x1="180" y1="90" x2="180" y2="110" marker-end="url(#Arr4)" stroke="black" stroke-width="1.5"/>

      <rect x="65" y="112" width="230" height="36" stroke="black" stroke-width="1" rx="6" fill="#f5f5f5"/>
      <text x="180" y="126" fill="#333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">2. 初始化变量池</text>
      <text x="180" y="140" fill="#666" font-family="sans-serif" font-size="9" text-anchor="middle">注入 sys.user_query, sys.history, sys.cur_date 等</text>

      <line x1="180" y1="148" x2="180" y2="170" marker-end="url(#Arr4)" stroke="black" stroke-width="1.5"/>

      <rect x="65" y="172" width="230" height="36" stroke="#667eea" stroke-width="1.5" rx="6" fill="#e8ecf8"/>
      <text x="180" y="186" fill="#333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">3. 执行意图分类器 (C³-Classifier)</text>
      <text x="180" y="200" fill="#555" font-family="sans-serif" font-size="9" text-anchor="middle">关键词→fastText→Embedding→LLM</text>

      <line x1="180" y1="208" x2="180" y2="235" marker-end="url(#Arr4)" stroke="black" stroke-width="1.5"/>

      <rect x="65" y="237" width="230" height="54" stroke="black" stroke-width="1" rx="6" fill="#f5f5f5"/>
      <text x="180" y="252" fill="#333" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">4. 遍历节点执行</text>
      <text x="180" y="266" fill="#666" font-family="sans-serif" font-size="9" text-anchor="middle">① Condition条件匹配检查</text>
      <text x="180" y="279" fill="#666" font-family="sans-serif" font-size="9" text-anchor="middle">② 加载Agent &amp; VDB绑定 &amp; KB检索</text>
      <text x="180" y="292" fill="#666" font-family="sans-serif" font-size="9" text-anchor="middle">③ 渲染InputTemplate &amp; SystemPrompt</text>

      <line x1="180" y1="291" x2="180" y2="320" marker-end="url(#Arr4)" stroke="black" stroke-width="1.5"/>

      <rect x="260" y="322" width="80" height="54" stroke="#f97316" stroke-width="1" rx="4" fill="#fff7ed"/>
      <text x="300" y="338" fill="#92400e" font-family="sans-serif" font-size="10" text-anchor="middle">非最终节点</text>
      <text x="300" y="352" fill="#92400e" font-family="sans-serif" font-size="9" text-anchor="middle">同步调用LLM</text>
      <text x="300" y="366" fill="#92400e" font-family="sans-serif" font-size="9" text-anchor="middle">→存入变量池</text>

      <rect x="20" y="322" width="80" height="54" stroke="#22c55e" stroke-width="1" rx="4" fill="#f0fdf4"/>
      <text x="60" y="338" fill="#166534" font-family="sans-serif" font-size="10" text-anchor="middle">最终节点</text>
      <text x="60" y="352" fill="#166534" font-family="sans-serif" font-size="9" text-anchor="middle">流式调用LLM</text>
      <text x="60" y="366" fill="#166534" font-family="sans-serif" font-size="9" text-anchor="middle">→SSE推送</text>

      <line x1="180" y1="291" x2="60" y2="322" marker-end="url(#Arr4)" stroke="#22c55e" stroke-width="1"/>
      <line x1="180" y1="291" x2="300" y2="322" marker-end="url(#Arr4)" stroke="#f97316" stroke-width="1"/>

      <line x1="60" y1="376" x2="60" y2="440" marker-end="url(#Arr4)" stroke="black" stroke-width="1"/>
      <line x1="300" y1="376" x2="300" y2="440" marker-end="url(#Arr4)" stroke="black" stroke-width="1"/>

      <rect x="12" y="442" width="60" height="28" stroke="#22c55e" stroke-width="1" rx="4" fill="#f0fdf4"/>
      <text x="42" y="460" fill="#166534" font-family="sans-serif" font-size="9" text-anchor="middle">推送done</text>

      <rect x="78" y="442" width="204" height="28" stroke="#f97316" stroke-width="1" rx="4" fill="#fff7ed"/>
      <text x="180" y="460" fill="#92400e" font-family="sans-serif" font-size="9" text-anchor="middle">下一节点可用 {{变量名}} 引用</text>

      <line x1="180" y1="470" x2="180" y2="500" marker-end="url(#Arr4)" stroke="black" stroke-width="1.5"/>

      <ellipse cx="180" cy="518" rx="55" ry="14" stroke="#667eea" stroke-width="2" fill="#667eea"/>
      <text x="180" y="522" fill="white" font-family="sans-serif" font-size="11" text-anchor="middle" font-weight="bold">工作流执行完成</text>
    </g>
  </g>
</svg>
