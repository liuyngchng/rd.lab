<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 500" width="320" height="500">
  <defs>
    <marker orient="auto" overflow="visible" markerUnits="strokeWidth" id="Arrow2" viewBox="-1 -4 10 8" markerWidth="10" markerHeight="8" color="black"><g><path d="M 8 0 L 0 -3 L 0 3 Z" fill="currentColor" stroke="currentColor" stroke-width="1"/></g></marker>
  </defs>
  <g stroke="none" stroke-opacity="1" stroke-dasharray="none" fill="none" fill-opacity="1">
